<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="550" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">visitor-tracker — CI/CD to AWS EKS</text>

  <!-- CI/CD lane -->
  <rect x="20" y="60" width="250" height="560" rx="10" fill="#f3f0ff" stroke="#7c5cff"/>
  <text x="145" y="84" text-anchor="middle" font-weight="bold" fill="#4b2fd1">GitHub</text>
  <rect x="45" y="100" width="200" height="44" rx="6" fill="#fff" stroke="#7c5cff"/><text x="145" y="127" text-anchor="middle">Developer push / PR</text>
  <rect x="45" y="170" width="200" height="60" rx="6" fill="#fff" stroke="#7c5cff"/><text x="145" y="195" text-anchor="middle">Test: pytest</text><text x="145" y="214" text-anchor="middle">terraform fmt + validate</text>
  <rect x="45" y="256" width="200" height="60" rx="6" fill="#fff" stroke="#7c5cff"/><text x="145" y="281" text-anchor="middle">Docker build</text><text x="145" y="300" text-anchor="middle">Trivy scan (HIGH/CRIT)</text>
  <rect x="45" y="342" width="200" height="60" rx="6" fill="#fff" stroke="#7c5cff"/><text x="145" y="367" text-anchor="middle">Manual approval</text><text x="145" y="386" text-anchor="middle">(production env)</text>
  <rect x="45" y="428" width="200" height="60" rx="6" fill="#fff" stroke="#7c5cff"/><text x="145" y="453" text-anchor="middle">kubectl apply -k</text><text x="145" y="472" text-anchor="middle">rollout / auto-rollback</text>
  <rect x="45" y="520" width="200" height="70" rx="6" fill="#fff8e1" stroke="#e0a800"/><text x="145" y="545" text-anchor="middle" font-weight="bold">Terraform (IaC)</text><text x="145" y="564" text-anchor="middle">VPC · EKS · ECR · IAM</text><text x="145" y="580" text-anchor="middle">state in S3 (S3 locking)</text>
  <g stroke="#444" marker-end="url(#a)"><line x1="145" y1="144" x2="145" y2="168"/><line x1="145" y1="230" x2="145" y2="254"/><line x1="145" y1="316" x2="145" y2="340"/><line x1="145" y1="402" x2="145" y2="426"/></g>

  <!-- AWS cloud -->
  <rect x="300" y="60" width="780" height="560" rx="10" fill="#fff7ef" stroke="#ff9900"/>
  <text x="320" y="84" font-weight="bold" fill="#c26e00">AWS (us-east-1)</text>
  <rect x="320" y="100" width="160" height="50" rx="6" fill="#fff" stroke="#ff9900"/><text x="400" y="122" text-anchor="middle">IAM OIDC role</text><text x="400" y="139" text-anchor="middle" font-size="11">no static keys</text>
  <rect x="320" y="256" width="160" height="60" rx="6" fill="#fff" stroke="#ff9900"/><text x="400" y="281" text-anchor="middle" font-weight="bold">Amazon ECR</text><text x="400" y="300" text-anchor="middle" font-size="11">immutable tags, scan on push</text>
  <g stroke="#7c5cff" stroke-dasharray="5 4" marker-end="url(#a)" fill="none">
    <path d="M245,264 C285,264 280,125 318,125"/>
    <line x1="245" y1="286" x2="318" y2="286"/>
    <path d="M245,458 C290,458 300,420 545,420"/>
  </g>

  <!-- VPC -->
  <rect x="510" y="100" width="550" height="500" rx="10" fill="#eef7ff" stroke="#2f80ed"/>
  <text x="530" y="122" font-weight="bold" fill="#1a5fb4">VPC 10.0.0.0/16 · 2 AZs</text>
  <rect x="530" y="135" width="510" height="70" rx="6" fill="#e6f4ea" stroke="#34a853"/>
  <text x="545" y="155" fill="#1e7e34" font-weight="bold">Public subnets</text>
  <rect x="640" y="160" width="160" height="36" rx="6" fill="#fff" stroke="#34a853"/><text x="720" y="183" text-anchor="middle">Application LB</text>
  <rect x="840" y="160" width="160" height="36" rx="6" fill="#fff" stroke="#34a853"/><text x="920" y="183" text-anchor="middle">NAT Gateway</text>

  <rect x="530" y="220" width="510" height="365" rx="6" fill="#f5f9ff" stroke="#2f80ed" stroke-dasharray="4 3"/>
  <text x="545" y="240" fill="#1a5fb4" font-weight="bold">Private subnets — EKS managed node group (2–4 × t3.medium)</text>

  <rect x="545" y="255" width="300" height="200" rx="8" fill="#fff" stroke="#326ce5"/>
  <text x="830" y="275" text-anchor="end" font-weight="bold" fill="#326ce5">namespace: visitor-tracker</text>
  <rect x="560" y="290" width="125" height="56" rx="6" fill="#e8efff" stroke="#326ce5"/><text x="622" y="314" text-anchor="middle">api pods</text><text x="622" y="332" text-anchor="middle" font-size="11">FastAPI ×2–10</text>
  <rect x="705" y="290" width="125" height="56" rx="6" fill="#e8efff" stroke="#326ce5"/><text x="767" y="314" text-anchor="middle">redis</text><text x="767" y="332" text-anchor="middle" font-size="11">visit counter</text>
  <rect x="560" y="365" width="270" height="70" rx="6" fill="#f7f7f7" stroke="#999"/><text x="695" y="388" text-anchor="middle" font-size="12">Ingress · Service · HPA (70% CPU)</text><text x="695" y="406" text-anchor="middle" font-size="12">PDB · probes · non-root, RO rootfs</text><text x="695" y="424" text-anchor="middle" font-size="12">rolling update (maxUnavailable 0)</text>

  <rect x="865" y="255" width="160" height="200" rx="8" fill="#fff" stroke="#e6522c"/>
  <text x="945" y="275" text-anchor="middle" font-weight="bold" fill="#e6522c">monitoring</text>
  <rect x="880" y="290" width="130" height="44" rx="6" fill="#fff1ec" stroke="#e6522c"/><text x="945" y="317" text-anchor="middle">Prometheus</text>
  <rect x="880" y="346" width="130" height="44" rx="6" fill="#fff1ec" stroke="#f2a33a"/><text x="945" y="373" text-anchor="middle">Grafana</text>
  <rect x="880" y="402" width="130" height="44" rx="6" fill="#fff1ec" stroke="#e6522c"/><text x="945" y="429" text-anchor="middle">Alertmanager</text>

  <rect x="545" y="475" width="480" height="95" rx="8" fill="#fff" stroke="#999"/>
  <text x="560" y="497" font-weight="bold" fill="#555">kube-system</text>
  <text x="560" y="520">AWS Load Balancer Controller → provisions the ALB from Ingress</text>
  <text x="560" y="542">CoreDNS · kube-proxy · VPC CNI (EKS add-ons)</text>

  <!-- flows -->
  <g stroke="#444" marker-end="url(#a)" fill="none">
    <line x1="720" y1="62" x2="720" y2="158"/>
    <line x1="650" y1="196" x2="622" y2="288"/>
    <line x1="685" y1="318" x2="703" y2="318"/>
    <path d="M878,325 L852,325 L852,357 L622,357 L622,349"/>
    <line x1="945" y1="334" x2="945" y2="344"/>
  </g>
  <rect x="660" y="44" width="120" height="22" rx="11" fill="#222"/><text x="720" y="60" text-anchor="middle" fill="#fff" font-size="12">Users (HTTP)</text>
  <text x="700" y="354" font-size="10" fill="#e6522c">scrape /metrics</text>
  <path d="M400,316 L400,600 L560,600" stroke="#ff9900" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="410" y="590" font-size="11" fill="#c26e00">nodes pull image</text>
</svg>
