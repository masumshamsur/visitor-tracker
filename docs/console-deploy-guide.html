onaws.com\"]\n    }\n\n    condition {\n      test     = \"StringLike\"\n      variable = \"token.actions.githubusercontent.com:sub\"\n      # Both formats: the classic owner/repo name, and GitHub's\n      # \"immutable\" one with ID numbers (var.github_sub_prefix).\n      values = [\n        \"repo:${var.github_repo}:ref:refs/heads/main\",\n        \"repo:${var.github_repo}:environment:production\",\n        \"${var.github_sub_prefix}:ref:refs/heads/main\",\n        \"${var.github_sub_prefix}:environment:production\",\n      ]\n    }\n  }\n}\n\nresource \"aws_iam_role\" \"github_ci\" {\n  name               = \"${var.project}-github-ci\"\n  assume_role_policy = data.aws_iam_policy_document.github_trust.json\n}\n\n# What the role may do: push to the ECR repo and look up the cluster (console Step 22).\ndata \"aws_iam_policy_document\" \"github_ci\" {\n  statement {\n    actions   = [\"ecr:GetAuthorizationToken\"]\n    resources = [\"*\"]\n  }\n\n  statement {\n    actions   = [\"eks:DescribeCluster\"]\n    resources = [module.eks.cluster_arn]\n  }\n\n  statement {\n    actions = [\n      \"ecr:BatchCheckLayerAvailability\",\n      \"ecr:InitiateLayerUpload\",\n      \"ecr:UploadLayerPart\",\n      \"ecr:CompleteLayerUpload\",\n      \"ecr:PutImage\",\n      \"ecr:BatchGetImage\",\n    ]\n    resources = [aws_ecr_repository.app.arn]\n  }\n}\n\nresource \"aws_iam_role_policy\" \"github_ci\" {\n  name   = \"${var.project}-ci-permissions\"\n  role   = aws_iam_role.github_ci.id\n  policy = data.aws_iam_policy_document.github_ci.json\n}\n```\n\nWhat it does:\n- `data \"aws_iam_openid_connect_provider\"` **looks up** the GitHub identity provider that already exists in your account (from another project). An account can only have one, so Terraform reuses it instead of creating it. Because it's a `data` block, `terraform destroy` won't delete it, and your other project keeps working.\n- `data \"aws_iam_policy_document\" \"github_trust\"` is the **trust policy**: who may use the role. It allows your repo's `main` branch and its `production` environment, the fix you made by hand in console Step 22. A `data` block like this only builds JSON; it doesn't create anything in AWS.\n- `aws_iam_role` creates the role `visitor-tracker-github-ci`.\n- The second policy document says **what the role may do**: get an ECR login, describe only *this* cluster, and push only to *this* repository. That's tighter than the console version, which allowed `eks:DescribeCluster` on any cluster.\n\n### Verify\n- [ ] `terraform validate` says `Success!`\n\n## Step T10 \u00b7 iam-lbc.tf and its policy file\n\n**Goal:** permissions for the AWS Load Balancer Controller (console Steps 14\u201315). This part was manual in the first Terraform draft; now it's code too.\n\n**Time:** 10 min \u00b7 **Cost:** free\n\n1. Download the official policy into the `policies/` folder:\n\n```bash\ncd ~/Documents/aws/aws-labs/visitor-tracker/terraform\ncurl -fsSL -o policies/aws-load-balancer-controller.json https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/main/docs/install/iam_policy.json\n```\n\n2. Create `terraform/iam-lbc.tf`:\n\n```hcl\n# The AWS Load Balancer Controller's permissions (console Steps 14-15).\n\n# The official policy, saved as a file in policies/.\nresource \"aws_iam_policy\" \"lbc\" {\n  name   = \"${var.project}-lbc-policy\"\n  policy = file(\"${path.module}/policies/aws-load-balancer-controller.json\")\n}\n\n# Only EKS Pod Identity may assume this role.\ndata \"aws_iam_policy_document\" \"lbc_trust\" {\n  statement {\n    actions = [\"sts:AssumeRole\", \"sts:TagSession\"]\n\n    principals {\n      type        = \"Service\"\n      identifiers = [\"pods.eks.amazonaws.com\"]\n    }\n  }\n}\n\nresource \"aws_iam_role\" \"lbc\" {\n  name               = \"${var.project}-lbc-role\"\n  assume_role_policy = data.aws_iam_policy_document.lbc_trust.json\n}\n\nresource \"aws_iam_role_policy_attachment\" \"lbc\" {\n  role       = aws_iam_role.lbc.name\n  policy_arn = aws_iam_policy.lbc.arn\n}\n\n# Give the role to the controller's Kubernetes service account.\nresource \"aws_eks_pod_identity_association\" \"lbc\" {\n  cluster_name    = module.eks.cluster_name\n  namespace       = \"kube-system\"\n  service_account = \"aws-load-balancer-controller\"\n  role_arn        = aws_iam_role.lbc.arn\n}\n```\n\nWhat it does:\n- `aws_iam_policy` creates the policy from the JSON file. `file(...)` reads the file, and `path.module` means \"this folder\".\n- `data \"aws_iam_policy_document\" \"lbc_trust\"` allows only **EKS Pod Identity** (`pods.eks.amazonaws.com`) to use the role.\n- `aws_iam_role` and `aws_iam_role_policy_attachment` create the role and attach the policy.\n- `aws_eks_pod_identity_association` links the role to the `aws-load-balancer-controller` service account in `kube-system`. That's console Step 15.\n\n### Verify\n- [ ] `policies/aws-load-balancer-controller.json` exists and starts with `{`\n- [ ] `terraform validate` says `Success!`\n\n## Step T11 \u00b7 outputs.tf\n\n**Goal:** print the values you need after `apply`.\n\n**Time:** 5 min \u00b7 **Cost:** free\n\nCreate `terraform/outputs.tf`:\n\n```hcl\noutput \"cluster_name\" {\n  value = module.eks.cluster_name\n}\n\noutput \"vpc_id\" {\n  value = module.vpc.vpc_id\n}\n\noutput \"ecr_repository_url\" {\n  value = aws_ecr_repository.app.repository_url\n}\n\noutput \"github_ci_role_arn\" {\n  description = \"Put this in the GitHub secret AWS_CI_ROLE_ARN\"\n  value       = aws_iam_role.github_ci.arn\n}\n\noutput \"kubeconfig_command\" {\n  description = \"Run this to connect kubectl\"\n  value       = \"aws eks update-kubeconfig --region ${var.region} --name ${module.eks.cluster_name}\"\n}\n```\n\nWhat it does: after `apply`, Terraform prints these values. You can see them again any time with `terraform output`, or get one value with, for example, `terraform output -raw github_ci_role_arn`.\n\n### Verify\n- [ ] `terraform validate` says `Success!`\n- [ ] Your folder matches the structure in Step T2\n\n# Attempt 2 \u00b7 Build, deploy, destroy\n\n## Step T12 \u00b7 Check the plan\n\n**Goal:** see exactly what Terraform will create, before it creates anything.\n\n**Time:** 10 min \u00b7 **Cost:** free\n\n```bash\ncd ~/Documents/aws/aws-labs/visitor-tracker/terraform\nterraform fmt -recursive\nterraform validate\nterraform plan -out=tfplan\n```\n\n- `fmt` tidies the spacing in your files. The GitHub pipeline checks this, so always run it before you commit.\n- `plan -out=tfplan` saves the plan to a file, so `apply` does exactly what you reviewed.\n\nRead through the plan. Lines with `+` will be created. Look for the VPC, subnets, NAT Gateway, the EKS cluster and node group, the ECR repository, the IAM roles and the Pod Identity association. The last line is `Plan: N to add, 0 to change, 0 to destroy.` Expect roughly **60\u201390 resources** (this build showed 63) (the two modules create many small pieces, such as security group rules and IAM policy attachments).\n\n### Verify\n- [ ] The plan finishes with `0 to change, 0 to destroy`\n- [ ] You can find `module.eks.aws_eks_cluster.this[0]` and `aws_ecr_repository.app` in the plan\n\n## Step T13 \u00b7 Apply\n\n**Goal:** build the infrastructure.\n\n**Time:** 15\u201320 min (mostly waiting for EKS) \u00b7 **Cost:** about $6\u20137/day from now on\n\n```bash\nterraform apply tfplan\n```\n\nNo `yes` prompt this time, because you already reviewed the saved plan. While it runs, open the **S3** console and look in your state bucket: you'll see `visitor-tracker/terraform.tfstate.tflock` (the lock) while Terraform works. It disappears at the end.\n\n### Verify\n- [ ] It ends with `Apply complete!` and prints the outputs\n- [ ] The S3 bucket now holds `visitor-tracker/terraform.tfstate`\n- [ ] **EKS** console: `visitor-tracker-eks` is **Active**, the node group has 2 nodes, all 5 add-ons are **Active**, and **Access** \u2192 **Pod Identity associations** lists `aws-load-balancer-controller`\n- [ ] Running `terraform plan` again says `No changes.`\n\n## Step T14 \u00b7 Connect kubectl and install the cluster add-ons\n\n**Goal:** the same cluster setup as console Steps 13 and 16\u201317, in a few commands.\n\n**Time:** 10 min \u00b7 **Cost:** included above\n\n1. Connect kubectl:\n\n```bash\n$(terraform output -raw kubeconfig_command)\nkubectl get nodes\n```\n\n2. Install the Load Balancer Controller, Prometheus and Grafana with the project's script. Run it from the project root:\n\n```bash\ncd ~/Documents/aws/aws-labs/visitor-tracker\nGRAFANA_PASSWORD='choose-a-password' AWS_REGION=us-east-1 ./monitoring/install.sh\n```\n\nThe script runs the same `helm install` commands as console Steps 16\u201317, and also creates the `visitor-tracker` namespace with the alert rules. The controller's AWS permissions already exist, because Terraform created the Pod Identity association.\n\n### Verify\n- [ ] `kubectl get nodes` shows 2 `Ready` nodes\n- [ ] `kubectl -n kube-system get deploy aws-load-balancer-controller` shows `2/2`\n- [ ] `kubectl -n monitoring get pods` shows all pods `Running`\n\n## Step T15 \u00b7 Deploy through the pipeline\n\n**Goal:** the GitHub Actions pipeline deploys to the Terraform-built cluster.\n\n**Time:** 15 min \u00b7 **Cost:** free\n\n1. Get the CI role's ARN:\n\n```bash\ncd ~/Documents/aws/aws-labs/visitor-tracker/terraform\nterraform output -raw github_ci_role_arn\n```\n\n2. Add it as a GitHub secret: repo \u2192 **Settings** \u2192 **Secrets and variables** \u2192 **Actions** \u2192 **New repository secret**. **Name:** `AWS_CI_ROLE_ARN`, **Secret:** the ARN \u2192 **Add secret**. (If the secret already exists, click it and **Update** it instead.)\n\n   > **Why?** It tells the pipeline which IAM role to use for AWS access, without stored keys. See the note in Step 24.\n3. Add the manual approval gate: **Settings** \u2192 **Environments** \u2192 **New environment** \u2192 name `production` \u2192 **Configure environment** \u2192 tick **Required reviewers**, add yourself \u2192 **Save protection rules**. (Skip this if `production` already exists.)\n\n   > **Why?** Saving the rule makes the `deploy` job wait for your approval before it changes the live cluster. Without it, every push deploys straight away. See the note in Step 24.\n4. Commit your Terraform code and push. The push starts the pipeline:\n\n```bash\ncd ~/Documents/aws/aws-labs/visitor-tracker\ngit add terraform\ngit status\ngit commit -m \"Add Terraform infrastructure\"\ngit push\n```\n\n   Check that `git status` lists your `.tf` files, `.terraform.lock.hcl` and the policy JSON, but **not** `terraform.tfvars`, `.terraform/` or any `.tfstate` file (`.gitignore` keeps those out).\n\n5. In **Actions**, open the run. `preflight` now finds both the `terraform/` folder and the AWS secret, so every job runs. `terraform-check` checks your formatting and validates your code. When `deploy` shows **Waiting for review**, click **Review deployments** \u2192 tick `production` \u2192 **Approve and deploy**.\n6. Open the app:\n\n```bash\nkubectl -n visitor-tracker get ingress api\n```\n\nOpen `http://<ADDRESS>` once the ALB is active (2\u20134 minutes).\n\n### Troubleshooting\n\n**`build-scan-push` fails at \"Configure AWS credentials\" with `Not authorized to perform sts:AssumeRoleWithWebIdentity`**\n\nAWS refused the pipeline's login. Check these in order:\n\n1. **The secret.** `AWS_CI_ROLE_ARN` must be exactly the output of `terraform output -raw github_ci_role_arn`, without the `%` that zsh shows at the end.\n2. **The identity provider.** IAM \u2192 **Identity providers** \u2192 `token.actions.githubusercontent.com`. Its audience must be `sts.amazonaws.com`.\n3. **The subject GitHub sends.** This is the usual cause. Run:\n\n```bash\ngh api repos/masumshamsur/visitor-tracker/actions/oidc/customization/sub\n```\n\n   If it shows `\"use_immutable_subject\": true`, GitHub logs in as `repo:masumshamsur@<owner ID>/visitor-tracker@<repo ID>:...` instead of `repo:masumshamsur/visitor-tracker:...`. The role's trust policy must allow that form too.\n\n4. **Compare with the trust policy.**\n\n```bash\naws iam get-role --role-name visitor-tracker-github-ci --query 'Role.AssumeRolePolicyDocument'\n```\n\n   The `sub` list must contain the `sub_claim_prefix` from step 3, followed by `:ref:refs/heads/main` and `:environment:production`.\n\n**Fix:** set `github_sub_prefix` in `variables.tf` to your `sub_claim_prefix` (Step T5), make sure `iam-github.tf` uses it (Step T9), then from `terraform/`:\n\n```bash\nterraform fmt\nterraform plan -out=tfplan\nterraform apply tfplan\n```\n\nThe plan shows **1 to change** (the `visitor-tracker-github-ci` role). Then on GitHub open the failed run \u2192 **Re-run jobs** \u2192 **Re-run failed jobs**.\n\n**`terraform-check` fails at `fmt`:** run `terraform fmt -recursive` in `terraform/`, then commit and push again.\n\n**`build-scan-push` fails at \"Set up job\" with `Unable to resolve action aquasecurity/trivy-action@...`:** that version tag doesn't exist. The action's tags start with `v` (for example `v0.36.0`). Fix the `uses:` line in `.github/workflows/ci-cd.yml`, then commit and push.\n\n### Verify\n- [ ] All pipeline jobs are green, including `terraform-check`\n- [ ] The app loads from the ALB address and shows 2 pod names after **Send 10 requests**\n- [ ] Optional: do Steps 27\u201329 (Grafana, autoscaling, rollback, screenshots) on this cluster; they work the same on a Terraform-built cluster\n\n## Step T16 \u00b7 Destroy everything\n\n**Goal:** remove it all with Terraform, and see how much faster that is than Step 30.\n\n**Time:** 20 min (mostly waiting) \u00b7 **Cost:** charges stop\n\nThe order still matters. Terraform doesn't know about the ALB, because the Load Balancer Controller created it from inside Kubernetes. Delete the app first, or the VPC can't be deleted.\n\n1. Delete the app (this removes the ALB):\n\n```bash\ncd ~/Documents/aws/aws-labs/visitor-tracker\nkubectl kustomize k8s | sed \"s#IMAGE_PLACEHOLDER#x#; s#VERSION_PLACEHOLDER#x#\" | kubectl delete -f -\n```\n\n   Wait until **EC2** \u2192 **Load Balancers** no longer shows the `k8s-\u2026` ALB.\n\n2. Uninstall the Helm releases:\n\n```bash\nhelm -n monitoring uninstall monitoring\nhelm -n kube-system uninstall aws-load-balancer-controller\n```\n\n3. Destroy the main infrastructure:\n\n```bash\ncd terraform\nterraform destroy\n```\n\n   Review the list and type `yes`. It takes about 15 minutes.\n\n4. Destroy the state bucket last (it held the state you just used):\n\n```bash\ncd bootstrap\nterraform destroy\n```\n\n5. Clean up your kubeconfig:\n\n```bash\nkubectl config delete-context $(kubectl config current-context)\n```\n\n> `terraform destroy` doesn't touch the GitHub identity provider, because your code only looks it up with a `data` block. That's what you want: another project uses it.\n\n> **If the `k8s-` target group won't delete (\"in use by a listener or a rule\"):** AWS can hold on to it for a while after the load balancer is gone, and the controller then doesn't delete its 2 `k8s-` security groups. Check that nothing uses them (`aws ec2 describe-network-interfaces --filters Name=group-id,Values=<sg-id>` returns nothing), delete the 2 security groups in **EC2** \u2192 **Security Groups**, then carry on with step 2. The target group disappears by itself later.\n\n> **After the destroy:** delete the `AWS_CI_ROLE_ARN` secret on GitHub (or leave it and expect red runs). The role no longer exists, so the next push would fail at \"Configure AWS credentials\". Without the secret, `preflight` skips the AWS jobs.\n\n> **If `terraform destroy` gets stuck on the VPC or subnets:** a leftover load balancer or network interface is still using them. Check **EC2** \u2192 **Load Balancers**, **Target Groups** and **Network Interfaces** for `k8s-` items, delete them, then run `terraform destroy` again.\n\n### What gets deleted, how, and why\n\nSome things live **inside Kubernetes** or were created by a controller, so Terraform has never heard of them. Those you delete yourself, first. Everything Terraform created, Terraform deletes.\n\n**Deleted by you (manually), and why**\n\n| What | How | Why it can't be left to Terraform |\n|---|---|---|\n| App objects: namespace `visitor-tracker`, `api` and `redis` Deployments and Services, HPA, PDB, ServiceMonitor, Ingress | `kubectl delete` (step 1) | They live inside the cluster, created by the pipeline, not by Terraform. |\n| ALB `k8s-visitort-api-\u2026`, its target group and listener | Removed automatically by the Load Balancer Controller when the Ingress is deleted (step 1) | The controller created them, so Terraform doesn't know they exist. If they're left behind, they keep costing money and block the VPC from being deleted. |\n| 2 security groups `k8s-traffic-\u2026` and `k8s-visitort-api-\u2026` | Normally removed by the controller; deleted **by hand** in EC2 \u2192 Security Groups when the target group got stuck | Created by the controller. A leftover security group makes `terraform destroy` fail on the VPC with `DependencyViolation`. Only delete them once nothing uses them. |\n| Target group (if stuck) | Retry in EC2 \u2192 Target Groups, or wait; AWS removes the \"in use\" lock after a while | AWS can report \"in use by a listener\" for some minutes after the ALB is gone. A target group costs nothing and doesn't block the VPC. |\n| Helm releases `monitoring` (Prometheus, Grafana, Alertmanager) and `aws-load-balancer-controller` | `helm uninstall` (step 2) | Installed by the script, not Terraform. Uninstalling before the destroy is clean; remove the controller **after** the ALB is gone, because it's the thing that deletes the ALB. |\n| GitHub secret `AWS_CI_ROLE_ARN` | GitHub \u2192 Settings \u2192 Secrets | It points to a role that no longer exists. Without it, `preflight` skips the AWS jobs, so pushes stay green. |\n| kubeconfig context for `visitor-tracker-eks` | `kubectl config delete-context \u2026` (step 5) | Only a local file entry pointing at a cluster that's gone. |\n\n**Deleted by `terraform destroy` (step 3, 67 resources), and why**\n\nTerraform deletes everything in its state, in the reverse order it created it.\n\n| File | What gets destroyed | Why it matters |\n|---|---|---|\n| `eks.tf` | The node group (2 EC2 instances and their disks), the 5 add-ons, the EKS cluster, its IAM roles and policy attachments, security groups and rules, access entries, KMS key (AWS keeps it \"pending deletion\" for 7\u201330 days, then removes it) and CloudWatch log group | The cluster ($0.10/h) and the nodes are the biggest costs. |\n| `vpc.tf` | NAT Gateway and its Elastic IP, Internet Gateway, 4 subnets, route tables and routes, the VPC | The NAT Gateway costs about $0.045/h even when idle. An unused Elastic IP is charged too. |\n| `ecr.tf` | The `visitor-tracker` repository, its images and lifecycle policy | `force_delete = true` lets it go even with images inside. Images cost a little for storage. |\n| `iam-github.tf` | Role `visitor-tracker-github-ci` and its inline policy | No cost, but a trusted role with no use is a security risk. |\n| `iam-lbc.tf` | Role `visitor-tracker-lbc-role`, its policy, the attachment and the Pod Identity association | No cost; keeps IAM tidy. |\n\n**Deleted by `terraform destroy` in `bootstrap/` (step 4, 4 resources):** the state bucket with its versioning, encryption and public-access block. It goes **last** because the main destroy needs it to read the state. `force_destroy = true` lets Terraform delete it even though it still holds old state versions.\n\n**Kept on purpose**\n\n| What | Why |\n|---|---|\n| GitHub identity provider `token.actions.githubusercontent.com` | Your code only looks it up (a `data` block), so Terraform never deletes it. Another project uses it. |\n| Default VPC | AWS creates it for every account. It isn't part of this project. |\n| Budgets and Cost Anomaly Detection | They watch the whole account and cost nothing. |\n\n### Verify\n- [ ] Both `terraform destroy` runs end with `Destroy complete!`\n- [ ] EKS: no clusters. VPC: only the default VPC. EC2: no instances, load balancers or Elastic IPs from this project\n- [ ] S3: the state bucket is gone\n- [ ] The next day, your bill shows the charges have stopped\n"</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  const md = JSON.parse(document.getElementById("guide-md").textContent);
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem("cloudops-guide:" + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("cloudops-guide:" + k, JSON.stringify(v)); } catch {} },
  };

  // Split the Markdown into an overview plus steps grouped by phase.
  const pages = [{ id: "overview", num: "", title: "Overview & names", phase: "Start here", body: [] }];
  let phase = "Start here", cur = pages[0];
  for (const line of md.split("\n")) {
    let m;
    if ((m = line.match(/^# ((?:Phase|Attempt) .*)$/))) { phase = m[1]; continue; }
    if (/^# /.test(line)) continue; // document title
    if ((m = line.match(/^## Step ([A-Z]?\d+) \u00b7 (.*)$/))) {
      cur = { id: "step-" + m[1].toLowerCase(), num: m[1], title: m[2], phase, body: [] };
      pages.push(cur); continue;
    }
    cur.body.push(line);
  }
  const steps = pages.filter(p => p.num);
  const checks = store.get("checks") || {};

  function taskCount(p) { return (p.body.join("\n").match(/^\s*- \[ \]/gm) || []).length; }
  function isDone(p) {
    const n = taskCount(p); if (!n) return false;
    for (let i = 0; i < n; i++) if (!checks[p.id + ":" + i]) return false;
    return true;
  }

  const index = document.getElementById("index"), pick = document.getElementById("pick"), view = document.getElementById("view");
  function buildIndex() {
    index.innerHTML = ""; pick.innerHTML = "";
    let last = null, group = null;
    pages.forEach(p => {
      if (p.phase !== last) {
        last = p.phase;
        const h = document.createElement("div"); h.className = "ph"; h.textContent = p.phase; index.appendChild(h);
        group = document.createElement("optgroup"); group.label = p.phase; pick.appendChild(group);
      }
      const a = document.createElement("a");
      a.href = "#" + p.id; a.dataset.id = p.id;
      a.innerHTML = '<span class="n"><span></span></span><span></span>';
      a.firstChild.firstChild.textContent = p.num || "\u2022";
      a.lastChild.textContent = p.title;
      index.appendChild(a);
      const o = document.createElement("option"); o.value = p.id;
      o.textContent = (p.num ? p.num + ". " : "") + p.title; group.appendChild(o);
    });
  }

  function refreshProgress(activeId) {
    const done = steps.filter(isDone).length;
    document.getElementById("plabel").textContent = done + " of " + steps.length + " steps verified";
    const pct = Math.round(done / steps.length * 100);
    document.getElementById("ppct").textContent = pct + "%";
    document.getElementById("pbar").style.width = pct + "%";
    index.querySelectorAll("a").forEach(a => {
      const p = pages.find(x => x.id === a.dataset.id);
      a.classList.toggle("done", isDone(p));
      a.classList.toggle("cur", a.dataset.id === activeId);
    });
    pick.querySelectorAll("option").forEach(o => {
      const p = pages.find(x => x.id === o.value);
      o.textContent = (isDone(p) ? "\u2713 " : "") + (p.num ? p.num + ". " : "") + p.title;
    });
    pick.value = activeId;
  }

  function render(id) {
    const i = Math.max(0, pages.findIndex(p => p.id === id));
    const p = pages[i];
    let html = "";
    if (p.num) html += '<div class="crumb">' + p.phase + " \u00b7 Step " + p.num + " of " + steps.length + "</div><h2></h2>";
    html += marked.parse(p.body.join("\n"), { gfm: true });
    view.innerHTML = html;
    if (p.num) view.querySelector("h2").textContent = p.title;

    // Wrap code blocks with copy buttons and tables with scroll boxes.
    view.querySelectorAll("pre").forEach(pre => {
      const box = document.createElement("div"); box.className = "codebox";
      pre.replaceWith(box); box.appendChild(pre);
      const b = document.createElement("button"); b.className = "copy"; b.type = "button"; b.textContent = "Copy";
      b.onclick = () => {
        const text = pre.innerText.replace(/\n$/, "");
        const ok = () => { b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1400); };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, () => selectText(pre)); else selectText(pre);
      };
      box.appendChild(b);
    });
    view.querySelectorAll("table").forEach(t => { const d = document.createElement("div"); d.className = "tablebox"; t.replaceWith(d); d.appendChild(t); });

    // Make task-list checkboxes interactive and persistent.
    let k = 0;
    view.querySelectorAll("li > input[type=checkbox]").forEach(cb => {
      const li = cb.parentElement, key = p.id + ":" + k++;
      li.classList.add("task");
      const label = document.createElement("label"), span = document.createElement("span");
      while (cb.nextSibling) span.appendChild(cb.nextSibling);
      cb.removeAttribute("disabled"); cb.checked = !!checks[key];
      label.append(cb, span); li.appendChild(label);
      li.classList.toggle("checked", cb.checked);
      cb.onchange = () => {
        checks[key] = cb.checked; store.set("checks", checks);
        li.classList.toggle("checked", cb.checked);
        updateVerifyBadge(p); refreshProgress(p.id);
      };
    });
    updateVerifyBadge(p);

    // Previous / next.
    const pager = document.createElement("div"); pager.className = "pager";
    const prev = pages[i - 1], next = pages[i + 1];
    pager.innerHTML = '<button type="button" class="prev"></button><button type="button" class="next"></button>';
    const [bp, bn] = pager.querySelectorAll("button");
    if (prev) { bp.innerHTML = "<small>Previous</small>"; bp.append("\u2190 " + (prev.num ? prev.num + ". " : "") + prev.title); bp.onclick = () => go(prev.id); } else bp.disabled = true;
    if (next) { bn.innerHTML = "<small>" + (p.num && !isDone(p) ? "Next (finish Verify first)" : "Next") + "</small>"; bn.append((next.num ? next.num + ". " : "") + next.title + " \u2192"); bn.onclick = () => go(next.id); } else bn.disabled = true;
    view.appendChild(pager);

    store.set("last", p.id);
    refreshProgress(p.id);
  }

  function updateVerifyBadge(p) {
    const h = [...view.querySelectorAll("h3")].find(x => /^Verify/.test(x.textContent));
    if (!h) return;
    let badge = h.querySelector(".verify-state");
    if (!badge) { badge = document.createElement("span"); badge.className = "verify-state"; h.appendChild(badge); }
    const n = taskCount(p), got = [...Array(n).keys()].filter(i => checks[p.id + ":" + i]).length;
    badge.textContent = got === n ? "All passed" : got + " / " + n;
    badge.classList.toggle("ok", got === n);
  }

  function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  function go(id) { if (location.hash !== "#" + id) location.hash = id; else render(id); window.scrollTo({ top: 0 }); }

  pick.onchange = () => go(pick.value);
  document.getElementById("reset").onclick = function () {
    if (this.dataset.armed) {
      for (const key in checks) delete checks[key];
      store.set("checks", checks); this.textContent = "Clear my ticks"; delete this.dataset.armed;
      render(location.hash.slice(1) || "overview");
    } else { this.dataset.armed = "1"; this.textContent = "Click again to clear all ticks"; setTimeout(() => { this.textContent = "Clear my ticks"; delete this.dataset.armed; }, 3000); }
  };
  window.addEventListener("hashchange", () => render(location.hash.slice(1)));
  buildIndex();
  render(location.hash.slice(1) || store.get("last") || "overview");
})();
</script>
